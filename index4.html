<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    
    
</head>
<body>
    <section class="section4">
        <div class="left4">
            <div class="h5">
            <h5>Checkout</h5>
        </div>
        <div class="contect-detail">
            <h2>Contect Detail</h2>
            <div>
               <label for="email">Email ID</label>
            </div>
            <div>
               <input type="text" placeholder="Jhon Doe" class="card">
            </div>
            <h2>Payment</h2>
            <div class="payment-form">
                <div class="payment-option">
                    <div class="boxa">
                        <i class="fa-solid fa-money-bill"></i>
                        <span>Card</span>
                    </div>
                    <div class="boxb">
                        <i class="fa-brands fa-btc"></i>
                        <span>Crypto</span>
                    </div>
                    <div class="boxc">
                        <i class="fa-solid fa-building-columns"></i>
                        <span>Bank</span>
                    </div>
                    <div class="boxd">
                        <i class="fa-solid fa-bars"></i>
                    </div>
                    
                    </div>
                    <div class="card-number">
                        <label for="card">Card Number</label>
                      <div>
                        <input type="text" placeholder="Jhon Doe" class="card2">
                       </div>
                    </div> 
                    <div class="date">
                        <div class="div1">
                            <label for="expiry">Expiry</label>
                            <div>
                               <input type="text" placeholder="MM/YY" class="">
                            </div>
                        </div>
                        <div class="div1a">
                            <label for="CVC">CVC</label>
                            <div>
                            <input type="text" placeholder="..." class="cvc">
                            </div>
                        </div>
                    </div>
                    <div class="location">
                        <div class="div2">
                            <label for="country">Country</label>
                           <div>
                            <select name="country" id="countries">    
                                <option value="India">India</option>
                                <option value="America">America</option>
                                <option value="London">London</option>
                                <option value="London">London</option>
                            </select>
                          </div>
                        </div>
                        <div class="div2a">
                            <label for="zip">Zip</label>
                           <div>
                            <input type="text" placeholder="xxxx" class="zip">
                           </div>
                        </div>
                    </div>
                 </div>
            </div>
        </div>

        </div>
        <div class="right4">
            <h2 class="heading-h2">Order Summary</h2>
            <div class="order-Summary">
                <div class="price-box">
                    <div class="copon-section">
                      <label for="copon-lable">Enter Copon code</label>
                      <div class="copon-box">
                          <input type="text" class="copon-input2" placeholder="Copon Code">
                          <button type="button" class="aply-btn">Aply Copon</button>
                       </div>
                    </div>
                    <div class="price-totle">
                        <div class="price-row1">
                            <span>Sub totle</span>
                            <span>₹4,700</span>
                        </div> 
                        <div class="price-row2">
                            <span>Taxes(If appplicable)</span>
                            <span>₹199</span>
                        </div>
                        <div class="price-row3">
                           <span>Discount</span>
                           <span>₹0</span>
                        </div>
                        <div class="price-total">
                            <span>Total</span>
                            <span>₹4,999</span>
                        </div>
                    </div>
                
                </div>
            </div>
            <div class="pay-now">
                <button type="button" class="pay-btn3">Pay Now ₹4,999</button>
             <div class="shopping-link4">
                 <img src="Razorpay-img.jpng.png"  width="130" height="80" alt="image">  
                 <img src="paytem-img.jpeg" width="50px" height="20" alt="image"> 
             </div>
            </div>
        </div>
      
       </div>
    </section>
</body>
</html>
